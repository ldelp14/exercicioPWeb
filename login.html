<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/bootstrap-icons.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card p-4 shadow-sm border-0 text-center">

        <h2 class="text-center fw-bold mb-5 mt-2" style="color: #1a1a1a;">Acessar Conta</h2>

        <form>
            <div class="mb-2">
                <input type="email" class="form-control form-control-lg fs-6" placeholder="Seu e-mail">
            </div>

            <div class="mb-2 position-relative">
                <input type="password" class="form-control form-control-lg fs-6 " placeholder="Sua senha">
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold mb-3">Entrar</button>

            <div class="text-center">
                <a href="" class="text-secondary small">Esqueceu a senha?</a>
            </div>
        </form>
    
    </div>
</body>
</html>
