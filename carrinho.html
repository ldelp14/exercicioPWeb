<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-sm border-0 text-center w-100 overflow-hidden" style="max-width: 320px;">
        
        
        <div class="p-4">
            
            <div class="mb-3">
                <img src="fone.png" alt="Fone Bluetooth Pro" class="img-fluid" style="max-height: 180px; object-fit: contain;">
            </div>

            <h3 class="fw-bold mb-2" style="color: #1a1a1a;">Fone Bluetooth Pro</h3>
            <p class="fs-4 fw-medium text-success mb-2">R$ 199,00</p>
            <p class="text-secondary small mb-0 px-2">Alta qualidade de som, cancelamento de ruído. Bateria de longa duração.</p>

        </div>

        <div class="card-footer bg-light border-0 p-3">
            <button class="btn btn-primary w-100 py-2 fw-medium">Adicionar ao Carrinho</button>
        </div>

    </div>

</body>
</html>
